<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:rgba(255,255,255,.55)}
@keyframes drift{0%,100%{transform:translate(-14%,-8%) scale(1)}50%{transform:translate(16%,10%) scale(1.25)} }
@keyframes drift2{0%,100%{transform:translate(12%,8%) scale(1.2)}50%{transform:translate(-14%,-10%) scale(1)} }
@keyframes glow{0%,100%{box-shadow:0 0 22px rgba(224,0,8,.45)}50%{box-shadow:0 0 40px rgba(224,0,8,.85)} }
@keyframes fill{0%{width:18%}35%,100%{width:42%} }
@keyframes scan{0%{top:8%;opacity:0}15%,85%{opacity:1}100%{top:88%;opacity:0} }
@keyframes pop{0%,55%{opacity:0;transform:scale(.8)}65%,100%{opacity:1;transform:none} }
.disp{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:800;text-transform:uppercase}
.cta{display:flex;align-items:center;justify-content:center;height:56px;border-radius:28px;border:0;background:#E00008;color:#fff;font-size:17px;font-weight:700;width:100%;position:relative}
.fade{position:absolute;inset:0;-webkit-mask-image:radial-gradient(ellipse 95% 40% at 50% 78%,#000 20%,transparent 100%);mask-image:radial-gradient(ellipse 95% 40% at 50% 78%,#000 20%,transparent 100%)}
.dots{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:radial-gradient(circle,#000 1.1px,transparent 1.7px);mask-image:radial-gradient(circle,#000 1.1px,transparent 1.7px);-webkit-mask-size:11px 11px;mask-size:11px 11px}
@keyframes streak{0%{transform:translateX(-120%)}100%{transform:translateX(420%)} }
.trails{position:absolute;left:-30%;right:-30%;height:110px;transform:rotate(-8deg);filter:blur(6px);opacity:.3}
.trail{position:absolute;left:0;width:45%;height:4px;border-radius:2px;animation:streak 4.5s linear infinite}
.red{background:linear-gradient(90deg,transparent,#E00008 60%,#FF8A8E)}
.white{background:linear-gradient(90deg,transparent,#9DB8FF 60%,#fff)}
.field{height:56px;border-radius:28px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:17px;padding:0 22px;box-sizing:border-box;width:100%}
</style>
</helmet>
