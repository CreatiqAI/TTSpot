name: iOS → TestFlight

# Builds a signed App Store build on GitHub's macOS runners and uploads it to
# TestFlight. The distribution certificate and provisioning profile are created
# (first run) or fetched (later runs) through the App Store Connect API with
# Codemagic's CLI tools, so no Mac is needed. Run it from Actions → "iOS →
# TestFlight" → Run workflow; the build shows up in App Store Connect →
# TestFlight ~15-30 min after the upload finishes.
#
# Needs the bundle ID `my.ttspot.app` registered and an app record for it in
# App Store Connect. Secrets:
#   ENV_JSON, MAPS_API_KEY, GOOGLE_IOS_CLIENT_ID  same as ios.yml
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8         App Store Connect API key (Admin role)
#   IOS_CERT_PRIVATE_KEY                          RSA key the distribution certificate is tied to
#
# The app embeds a Notification Service Extension (my.ttspot.app.NotificationService,
# chat pushes as Communication Notifications). fetch-signing-files matches every
# bundle ID that starts with my.ttspot.app, so both get an App Store profile.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (off = build + sign + export only, to prove signing)'
        type: boolean
        default: true

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: my.ttspot.app
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Codemagic CLI tools
        run: pip install codemagic-cli-tools

      - name: Write build-time config (never committed)
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          printf '%s' "$ENV_JSON" > env.json
          printf 'machine api.mapbox.com\nlogin mapbox\npassword %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc && chmod 600 ~/.netrc
          REV=$(echo "${GOOGLE_IOS_CLIENT_ID:-ttspot}" | awk -F. '{ for (i=NF; i>0; i--) printf "%s%s", $i, (i>1 ? "." : "") }')
          {
            echo "MAPS_API_KEY=${MAPS_API_KEY}"
            echo "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID}"
            echo "GOOGLE_IOS_REVERSED_CLIENT_ID=${REV}"
          } > ios/Flutter/Secrets.xcconfig
          python3 -c "import json; json.load(open('env.json')); print('env.json ok')"

      # Plugins (mapbox_maps_flutter, Firebase, ...) build through Swift Package
      # Manager; the Runner project already references FlutterGeneratedPluginSwiftPackage.
      - name: Pub get with Swift Package Manager
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Signing (certificate + App Store profile via the API)
        run: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles   # writes ~/export_options.plist

      # Runner.entitlements asks for webcredentials:ttspot.my and www (iCloud Keychain
      # password AutoFill). fetch-signing-files reuses any ACTIVE profile and
      # never checks capabilities, so fail early, with the fix, if the profile
      # it found predates the Associated Domains capability on the App ID.
      - name: Check the profile has Associated Domains
        run: |
          found=0
          while IFS= read -r p; do
            security cms -D -i "$p" > "$RUNNER_TEMP/profile.plist" 2>/dev/null || continue
            if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then found=1; fi
          done < <(find "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' 2>/dev/null)
          if [ "$found" != 1 ]; then
            echo "::error::The App Store profile lacks Associated Domains. Check the capability is on for $BUNDLE_ID, delete its old IOS_APP_STORE profile in App Store Connect (never the certificate), then re-run: --create makes a fresh profile."
            exit 1
          fi
          echo "Profile includes Associated Domains"

      - name: Build signed .ipa
        # Build number = workflow run number, so every upload is higher than the
        # last (App Store Connect rejects repeats). Version name stays pubspec's.
        run: |
          set -o pipefail
          if ! flutter build ipa --release \
                --dart-define-from-file=env.json \
                --build-number=${{ github.run_number }} \
                --export-options-plist="$HOME/export_options.plist" -v > build.log 2>&1; then
            echo "::group::errors"; grep -n -iE "error:|Error \(Xcode\)|failed|fatal" build.log | grep -v "available)" | head -120; echo "::endgroup::"
            echo "::group::tail"; tail -150 build.log; echo "::endgroup::"
            exit 1
          fi
          ls -la build/ios/ipa

      # The extension must be inside the app, signed with its own profile, and
      # the app must carry the Communication Notifications entitlement.
      - name: Check the notification extension
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$(find build/ios/ipa -name '*.ipa' | head -1)" -d "$RUNNER_TEMP/ipa"
          APP=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -1)
          EXT="$APP/PlugIns/NotificationService.appex"
          test -d "$EXT" || { echo "::error::NotificationService.appex is missing from the app"; exit 1; }
          codesign --verify --strict "$EXT"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q 'com.apple.developer.usernotifications.communication'             || { echo "::error::The app is not signed with the Communication Notifications entitlement"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          security cms -D -i "$EXT/embedded.mobileprovision" | grep -A1 -E '<key>(Name|application-identifier)</key>'
          echo "Extension embedded and signed"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        run: app-store-connect publish --path "$(find build/ios/ipa -name '*.ipa' | head -1)"

      # Crashlytics needs each build's dSYMs to turn native iOS crash addresses
      # (Flutter engine, App.framework, plugins) into file:line; without them
      # Firebase mails "Missing dSYM". The app configures Firebase from env.json,
      # so a minimal GoogleService-Info.plist is written just for the tool.
      # Never blocks a release.
      - name: Upload dSYMs to Crashlytics
        if: ${{ inputs.upload }}
        continue-on-error: true
        run: |
          set -e
          DSYMS=build/ios/archive/Runner.xcarchive/dSYMs
          ls "$DSYMS"
          UP=$(find ios/Pods "$HOME/Library/Developer/Xcode/DerivedData" -type f -name upload-symbols -path '*Crashlytics*' 2>/dev/null | head -1)
          if [ -z "$UP" ]; then
            curl -fsSL -o "$RUNNER_TEMP/upload-symbols" https://raw.githubusercontent.com/firebase/firebase-ios-sdk/main/Crashlytics/upload-symbols
            chmod +x "$RUNNER_TEMP/upload-symbols"
            UP="$RUNNER_TEMP/upload-symbols"
          fi
          python3 - "$RUNNER_TEMP/GoogleService-Info.plist" <<'PY'
          import json, plistlib, sys
          e = json.load(open('env.json'))
          plistlib.dump({'GOOGLE_APP_ID': e['FIREBASE_IOS_APP_ID'], 'API_KEY': e['FIREBASE_IOS_API_KEY'], 'PROJECT_ID': e['FIREBASE_PROJECT_ID'],
                         'GCM_SENDER_ID': e['FIREBASE_SENDER_ID'], 'BUNDLE_ID': 'my.ttspot.app'}, open(sys.argv[1], 'wb'))
          PY
          "$UP" -gsp "$RUNNER_TEMP/GoogleService-Info.plist" -p ios "$DSYMS"

      - uses: actions/upload-artifact@v4
        with:
          name: TTSpot-ios-appstore
          path: build/ios/ipa/*.ipa
          retention-days: 14

  # Internal testers ("Team") get every build on their own. The public-link
  # testers ("Beta testers") only get builds added to their group and approved
  # in Beta App Review, so this waits for processing, sets What to Test from
  # release_notes.dart, adds the build and submits it. Runs on Linux: it only
  # waits and calls the API.
  external:
    needs: build
    if: ${{ inputs.upload }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Send the build to external testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node tool/testflight_external.js ${{ github.run_number }}
