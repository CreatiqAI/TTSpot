<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TT Spot · Malaysia's car meet spot</title>
<link rel="icon" href="logo.png">
<style>
  :root { --ink:#0F1115; --muted:#737373; --red:#E11D2B; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#F5F5F7; color:var(--ink); }
  .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:440px; background:#fff; border-radius:20px; padding:36px 28px; box-shadow:0 10px 40px rgba(0,0,0,.08); text-align:center; }
  .logo { width:160px; }
  h1 { font-size:24px; margin:16px 0 6px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 22px; }
  .btn { display:block; padding:15px; margin-top:10px; border-radius:14px; font-weight:700; text-decoration:none; }
  .android { background:var(--ink); color:#fff; }
  .ios { background:#F0F0F0; color:var(--ink); }
  small { display:block; color:var(--muted); margin-top:22px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <img class="logo" src="logo.png" alt="TT Spot">
  <h1>The map that remembers where car people meet</h1>
  <p>Live meets, friends and your club on the map, check-ins that earn points, and rewards from partner shops. Malaysia first.</p>
  <a class="btn android" href="https://github.com/CreatiqAI/TTSpot/releases/download/latest/TTSpot.apk">Download for Android (test build)</a>
  <a class="btn ios" href="#">iPhone: TestFlight coming soon</a>
  <small>Private test build · Kuala Lumpur, Malaysia</small>
</div></div>
</body>
</html>
