<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Background: soft light trails</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
@keyframes streak{0%{transform:translateX(-120%)}100%{transform:translateX(420%)} }
.disp{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:800;text-transform:uppercase}
.trails{position:absolute;left:-30%;right:-30%;height:170px;transform:rotate(-12deg);filter:blur(6px);opacity:.34}
.trail{position:absolute;left:0;width:45%;height:4px;border-radius:2px;animation:streak 4.5s linear infinite}
.red{background:linear-gradient(90deg,transparent,#E00008 60%,#FF8A8E)}
.white{background:linear-gradient(90deg,transparent,#9DB8FF 60%,#fff)}
</style>
</helmet>
<div style="width: 390px; height: 520px; position: relative; overflow: hidden; background: #07080B; color: #fff; font-family: system-ui, sans-serif">
<div class="trails" style="top: 220px">
<div class="trail red" style="top: 30px"></div>
<div class="trail white" style="top: 85px; animation-duration: 3.4s; animation-delay: 1s"></div>
<div class="trail red" style="top: 140px; animation-duration: 5.5s; animation-delay: 2s"></div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 0; height: 200px; background: linear-gradient(180deg, #07080B 70%, transparent)"></div>
<div style="position: absolute; left: 24px; right: 24px; top: 56px; display: flex; flex-direction: column; gap: 8px">
<div class="disp" style="font-size: 40px; line-height: 40px">What's your name?</div>
<div style="font-size: 15px; color: rgba(255,255,255,.74)">This is how other drivers will see you.</div>
</div>
<div style="position: absolute; left: 24px; right: 24px; bottom: 30px">
<button style="width: 100%; height: 56px; border-radius: 28px; border: 0; background: #E00008; color: #fff; font-size: 17px; font-weight: 700">Continue</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
