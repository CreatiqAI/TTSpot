name: car_meet
description: "Malaysian car community app — discover meets, TT sessions and convoys on a map."
publish_to: 'none'
version: 0.3.58+68

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # --- approved stack -------------------------------------------------------
  supabase_flutter: ^2.9.0       # Auth, Postgres, Storage, Realtime
  mapbox_maps_flutter: ^2.31.1   # Map (approved 2026-09-28, replaces google_maps_flutter)
  flutter_riverpod: ^3.4.3       # State management (no codegen)
  go_router: ^18.0.1             # Navigation

  # --- approved for the auth step (2026-09-10) ------------------------------
  image_picker: ^1.2.3           # avatar / cover / car photos
  geolocator: ^14.0.3            # user location for map centering (added for map step)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  url_launcher: ^6.3.1
  record: ^6.0.0                # voice notes (mic)
  just_audio: ^0.10.4           # voice note playback
  video_player: ^2.9.5          # video messages
  path_provider: ^2.1.5         # temp file for a voice note while recording (already transitive)          # already pulled in by supabase_flutter; used to open Waze / Maps / WhatsApp

  # --- approved for store release (2026-09-23) -----------------------------
  sign_in_with_apple: ^8.2.0    # App Store guideline 4.8 (Google sign-in exists)
  crypto: ^3.0.7                # sha256 of the Apple nonce (already transitive via supabase)
  cached_network_image: ^4.0.1
  share_plus: ^13.3.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  # flutter_mapbox (in-app navigation) removed 2026-10-01: owner's call,
  # Directions hand off to Waze / Google Maps / Apple Maps instead.

  # --- approved 2026-09-29 -------------------------------------------------
  flutter_image_compress: ^2.5.1 # ~480 px JPEG thumbnails for grid tiles (less storage egress)

  # --- approved 2026-10-01 -------------------------------------------------
  camera: ^0.12.1                # in-app chat camera: tap for photo, hold for video

  # Not added: intl (dates formatted in lib/core/utils/dates.dart instead),
  # cached_network_image (plain NetworkImage is enough for MVP).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_style_dark.json
    - assets/map_style_light.json
    - assets/art/
    - assets/brand/
    - assets/cards/
    - assets/titi/
    - assets/avatars/
    - assets/covers/
    - assets/cars/
    - assets/badges/
    - assets/kinds/
    - assets/crests/
    - assets/partner_covers/
    - assets/prizes/
    - assets/event_types/
    - assets/vouchers/
    - assets/stickers/titi/
    - assets/stickers/car/
    - assets/wallpapers/
    - assets/portrait_samples/
  fonts:
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
