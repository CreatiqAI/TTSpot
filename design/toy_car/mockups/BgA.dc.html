<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Background A: dot aurora</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
@keyframes drift{0%,100%{transform:translate(-14%,-8%) scale(1)}50%{transform:translate(16%,10%) scale(1.25)} }
@keyframes drift2{0%,100%{transform:translate(12%,8%) scale(1.2)}50%{transform:translate(-14%,-10%) scale(1)} }
.disp{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:800;text-transform:uppercase}
.fade{position:absolute;inset:0;-webkit-mask-image:radial-gradient(ellipse 100% 60% at 50% 62%,#000 20%,transparent 100%);mask-image:radial-gradient(ellipse 100% 60% at 50% 62%,#000 20%,transparent 100%)}
.dots{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:radial-gradient(circle,#000 1.1px,transparent 1.7px);mask-image:radial-gradient(circle,#000 1.1px,transparent 1.7px);-webkit-mask-size:11px 11px;mask-size:11px 11px}
.blob{position:absolute;width:75%;height:50%;border-radius:50%;filter:blur(36px)}
</style>
</helmet>
<div style="width: 390px; height: 520px; position: relative; overflow: hidden; background: #07080B; color: #fff; font-family: system-ui, sans-serif">
<div class="fade"><div class="dots">
<div class="blob" style="left: -15%; top: 30%; background: #E00008; animation: drift 9s ease-in-out infinite"></div>
<div class="blob" style="right: -15%; top: 48%; background: #2F6BFF; animation: drift2 11s ease-in-out infinite"></div>
</div></div>
<div style="position: absolute; left: 24px; right: 24px; top: 56px; display: flex; flex-direction: column; gap: 8px">
<div class="disp" style="font-size: 40px; line-height: 40px">What's your name?</div>
<div style="font-size: 15px; color: rgba(255,255,255,.74)">This is how other drivers will see you.</div>
</div>
<div style="position: absolute; left: 24px; right: 24px; bottom: 30px">
<button style="width: 100%; height: 56px; border-radius: 28px; border: 0; background: #E00008; color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 0 30px rgba(224,0,8,.6)">Continue</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
