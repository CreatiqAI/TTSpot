<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TT Spot · Meet</title>
<style>
  body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: #f4f2ef; color: #101010; display: grid; place-items: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 20px; padding: 28px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.10); }
  img { width: 72px; }
  h1 { font-size: 22px; margin: 12px 0 6px; }
  p { color: #6b6b6b; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
  a.btn { display: block; background: #e00008; color: #fff; text-decoration: none; font-weight: 800; padding: 14px; border-radius: 999px; margin-bottom: 10px; }
  a.alt { display: block; color: #101010; font-weight: 700; text-decoration: none; padding: 10px; }
</style>
</head>
<body>
<div class="card">
  <img src="logo.png" alt="TT Spot">
  <h1>Open this meet in TT Spot</h1>
  <p id="msg">Opening the app…</p>
  <a class="btn" id="open" href="#">Open in TT Spot</a>
  <a class="alt" href="index.html">Don't have the app? Get TT Spot</a>
</div>
<script>
  const id = new URLSearchParams(location.search).get('id');
  const deep = id ? 'ttspot://event/' + encodeURIComponent(id) : 'ttspot://';
  document.getElementById('open').href = deep;
  if (id) { setTimeout(() => { location.href = deep; }, 300); }
  else { document.getElementById('msg').textContent = 'This link is missing the meet.'; }
  setTimeout(() => { document.getElementById('msg').textContent = 'If nothing happened, tap the button. On iPhone the app must be installed.'; }, 2500);
</script>
</body>
</html>
