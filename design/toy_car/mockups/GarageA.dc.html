<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage: car model with paint</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
@keyframes sweep{0%,60%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(460%) skewX(-20deg)} }
.disp{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:800;text-transform:uppercase}
.mask{position:absolute;inset:0;-webkit-mask-image:url(/_blob/a115577df0a1be4bf9641eef75e2e21e);mask-image:url(/_blob/a115577df0a1be4bf9641eef75e2e21e);-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden}
.paint{mix-blend-mode:multiply;transition:background-color .45s ease}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07080B; color: #fff; font-family: system-ui, sans-serif">
<div style="position: absolute; left: 20px; right: 20px; top: 64px; display: flex; align-items: center; justify-content: space-between">
<div class="disp" style="font-size: 34px; line-height: 34px">My garage</div>
<button aria-label="Add a car" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #fff; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
</button>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 124px; height: 366px; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); background: radial-gradient(ellipse 90% 55% at 50% 52%, #23262F 0%, #111318 78%)">
<div style="position: absolute; left: 20px; top: 18px; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.500px; color: rgba(255,255,255,.72)">TOYOTA · 2007</div>
<div class="disp" style="font-size: 30px; line-height: 30px">Estima</div>
</div>
<div style="position: absolute; right: 16px; top: 18px; padding: 6px 12px; border-radius: 14px; background: #E00008; font-size: 11px; font-weight: 800; letter-spacing: 1px">TODAY'S CAR</div>
<div style="position: absolute; left: 55px; top: 242px; width: 240px; height: 28px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.9), transparent 70%)"></div>
<div style="position: absolute; left: 35px; top: 62px; width: 280px; height: 210px">
<img src="/_blob/a115577df0a1be4bf9641eef75e2e21e" alt="Toyota Estima model" style="width: 100%; height: 100%; display: block">
<div class="mask paint" style="background-color: {{paint}}"></div>
<div class="mask"><div style="position: absolute; top: 0; bottom: 0; left: 0; width: 26%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: sweep 6s ease-in-out infinite"></div></div>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 1.500px; color: rgba(255,255,255,.72)"><span>PAINT</span><span style="color: #fff; letter-spacing: 0; font-size: 13px">{{paintName}}</span></div>
<div style="display: flex; gap: 8px">
<sc-for list="{{swatches}}" as="item" hint-placeholder-count="6">
<button aria-label="{{item.name}}" onClick="{{item.pick}}" style="width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 4px solid #15171D; background: {{item.sw}}; outline: {{item.ring}}; outline-offset: 0"></button>
</sc-for>
</div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 504px; display: flex; justify-content: center; gap: 8px">
<span style="width: 22px; height: 6px; border-radius: 3px; background: #fff"></span>
<span style="width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.3)"></span>
<span style="width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.3)"></span>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 526px; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px 0; border-radius: 22px; background: #111318; border: 1px solid rgba(255,255,255,.12)">
<div class="stat"><div class="disp" style="font-size: 28px; line-height: 28px">3</div><div style="font-size: 12px; color: rgba(255,255,255,.72)">Mods</div></div>
<div class="stat"><div class="disp" style="font-size: 28px; line-height: 28px">12</div><div style="font-size: 12px; color: rgba(255,255,255,.72)">Meets</div></div>
<div class="stat"><div class="disp" style="font-size: 28px; line-height: 28px">5</div><div style="font-size: 12px; color: rgba(255,255,255,.72)">Posts</div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button style="height: 52px; border-radius: 26px; border: 0; background: #fff; color: #07080B; font-size: 16px; font-weight: 700">Open car</button>
<button style="height: 52px; border-radius: 26px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-size: 16px; font-weight: 700">Edit</button>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #111318; border: 1px solid rgba(255,255,255,.12)">
<div style="width: 10px; height: 10px; border-radius: 50%; background: #FFB648"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">Road tax</div><div style="font-size: 13px; color: rgba(255,255,255,.72)">Renew in 21 days</div></div>
<div style="font-size: 13px; font-weight: 700; color: #FFB648">Soon</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const paints = [
{ name: 'Pearl white', hex: 'transparent', sw: '#F2F2F2' },
{ name: 'Racing red', hex: '#D0101A', sw: '#D0101A' },
{ name: 'Ocean blue', hex: '#1F4FD8', sw: '#1F4FD8' },
{ name: 'Midnight black', hex: '#24262C', sw: '#24262C' },
{ name: 'Silver', hex: '#9AA0AA', sw: '#9AA0AA' },
{ name: 'Sunset yellow', hex: '#F2B91E', sw: '#F2B91E' }
];
const picked = (this.state && this.state.picked) || 0;
return {
paint: paints[picked].hex,
paintName: paints[picked].name,
swatches: paints.map((p, i) => ({
name: p.name,
sw: p.sw,
ring: i === picked ? '2px solid #fff' : '2px solid transparent',
pick: () => this.setState({ picked: i })
}))
};
}
}
</script>
</body>
</html>
